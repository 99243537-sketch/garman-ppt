name: release
# skill/ 或 skill-probe/ 有改动推到 main（或手动运行）时：打包，上传到对应 Release（不存在就创建，已存在就覆盖附件）
on:
  push:
    branches: [main]
    paths: ["skill/**", "skill-probe/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { tag: v0.3.1, dir: skill, name: garman-ppt, asset: garman-ppt-0.3.1.zip, notes: RELEASE_NOTES.md, pre: "" }
          - { tag: v0.1.2-probe, dir: skill-probe, name: garman-ppt-probe, asset: garman-ppt-probe-0.1.2.zip, notes: RELEASE_NOTES_PROBE.md, pre: "--prerelease" }
    steps:
      - uses: actions/checkout@v4
      - name: 打包（压缩包顶层为技能目录，内含 SKILL.md）
        run: cd ${{ matrix.dir }} && zip -r "../${{ matrix.asset }}" ${{ matrix.name }} && cd .. && unzip -l "${{ matrix.asset }}"
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ matrix.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ matrix.tag }}" "${{ matrix.asset }}" --clobber
          else
            gh release create "${{ matrix.tag }}" "${{ matrix.asset }}" --target main --title "${{ matrix.tag }}" --notes-file "${{ matrix.notes }}" ${{ matrix.pre }}
          fi
